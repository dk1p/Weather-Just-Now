        :root {
            --clear-sky: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --cloudy: linear-gradient(135deg, #6a85b6 0%, #bac8e0 100%);
            --rainy: linear-gradient(135deg, #2c3e50 0%, #4ca1af 100%);
            --snowy: linear-gradient(135deg, #e6dada 0%, #274046 100%);
            --stormy: linear-gradient(135deg, #0f2027 0%, #203a43 100%);
            --night: linear-gradient(135deg, #0c2461 0%, #1e3799 100%);
            --sunset: linear-gradient(135deg, #ff7e5f 0%, #feb47b 100%);

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            min-height: 100vh;
            background: var(--clear-sky);
            transition: background 1.5s ease;
            color: white;
            position: relative;
            overflow-x: hidden;
        }

        /* Weather Particles */
        .weather-particle {
            position: absolute;
            z-index: 1;
            opacity: 0.7;
        }

        .cloud {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50px;
            filter: blur(2px);
            animation: floatCloud 60s linear infinite;
        }

        @keyframes floatCloud {
            0% { transform: translateX(-100px); }
            100% { transform: translateX(calc(100vw + 100px)); }
        }

        .rain-drop {
            background: linear-gradient(to bottom, transparent 0%, rgba(255, 255, 255, 0.8) 100%);
            animation: rainFall 1.5s linear infinite;
        }

        @keyframes rainFall {
            0% {
                transform: translateY(-100px);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(100vh);
                opacity: 0;
            }
        }

        .snow-flake {
            background: white;
            border-radius: 50%;
            filter: blur(1px);
            animation: snowFall 10s linear infinite;
        }

        @keyframes snowFall {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }

        .detail-label {

            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hourly-forecast {

            max-width: 1000px;
            padding: 0 20px;
        }

        .section-title {
            font-size: 2rem;
            font-weight: 300;
            margin-bottom: 30px;
            text-align: center;
            opacity: 0.9;
        }

        .hourly-container {

            padding: 20px 10px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.3) transparent;
        }

        .hourly-container::-webkit-scrollbar {
            height: 6px;
        }

        .hourly-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .hourly-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }

        .hour-card {
            min-width: 120px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
        }

        .hour-card:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.15);
        }

        .hour-time {
            font-size: 1.1rem;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .hour-icon {
            width: 60px;
            height: 60px;
            margin: 10px auto;
        }

        .hour-temp {
            font-size: 1.8rem;
            font-weight: 300;
            margin-top: 10px;
        }

        /* Loading Animation */
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .app-title {
                font-size: 3rem;
            }
            
            .city-name {
                font-size: 2.5rem;
            }
            
            .temperature-value {
                font-size: 6rem;
            }
            
            .weather-icon {
                width: 140px;
                height: 140px;
            }
            
            .weather-details {
                grid-template-columns: repeat(2, 1fr);

            .search-container {
                flex-direction: column;
                align-items: center;
            }
            
            .search-input {
                width: 100%;
            }
            
            .button-group {
                display: flex;
                gap: 15px;
            }
            
            .header-location {
                font-size: 1.2rem;
            }
            
            .weather-display {
                padding-top: 100px;
            }
        }

        @media (max-width: 480px) {
            .app-title {
                font-size: 2.5rem;

            }
            
            .temperature-value {
                font-size: 4.5rem;
            }
            
            .weather-icon {
                width: 120px;
                height: 120px;
            }
            
            .weather-details {
                grid-template-columns: 1fr;
            }
            
            .temperature-unit {
                font-size: 1.5rem;
                top: 10px;
            }
            
            .detail-value {
                font-size: 2rem;
            }
            
            .header-location {
                font-size: 1rem;
                margin: 0 10px;
            }
            
            .back-btn {
                width: 40px;
                height: 40px;
            }
        }

        .water-effect {

            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.3;
        }

        /* Quick Locations Grid */
        .quick-locations {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;

        .location-card {

        .location-card:hover {

            background: rgba(255, 255, 255, 0.2);
        }

        .location-icon {
            font-size: 2rem;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        /* Search History */
        .search-history {
            margin-top: 40px;

        .history-title {

            { name: 'Tamil Nadu', icon: 'fa-solid fa-gopuram' },
            { name: 'London', icon: 'fas fa-landmark' },
            { name: 'New York', icon: 'fas fa-city' },
            { name: 'Tokyo', icon: 'fas fa-torii-gate' },
            { name: 'Paris', icon: 'fas fa-building' },
            { name: 'Sydney', icon: 'fa-solid fa-hotel' },
            { name: 'Dubai', icon: 'fas fa-mosque' },
            { name: 'Singapore', icon: 'fas fa-gem' },
            { name: 'Berlin', icon: 'fas fa-archway' }
        ];
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            // Generate initial cloud particles
            generateWeatherParticles('clear');
            
            // Setup quick locations
            setupQuickLocations();
            
            // Load search history
            updateSearchHistory();
            
            // Event Listeners
            elements.searchBtn.addEventListener('click', handleSearch);
            elements.searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleSearch();
            });
            
            elements.locationBtn.addEventListener('click', getCurrentLocation);
            elements.backBtn.addEventListener('click', goBackToSearch);
            
            elements.celsiusBtn.addEventListener('click', () => switchUnit('metric'));
            elements.fahrenheitBtn.addEventListener('click', () => switchUnit('imperial'));
            
            // Update header time
            updateHeaderTime();
            setInterval(updateHeaderTime, 60000);
            
            // Update date
            updateDateTime();
            setInterval(updateDateTime, 60000);
        });
        
        // Setup Quick Locations
        function setupQuickLocations() {
            elements.quickLocations.innerHTML = popularCities.map(city => `
                <div class="location-card" onclick="fetchWeatherByCity('${city.name}')">
                    <div class="location-icon">
                        <i class="${city.icon}"></i>
                    </div>
                    <div class="location-name">${city.name}</div>
                </div>
            `).join('');
        }
        
        // Update Search History
        function updateSearchHistory() {
            if (searchHistory.length > 0) {
                elements.searchHistory.style.display = 'block';
                elements.historyList.innerHTML = searchHistory.slice(0, 8).map(city => `
                    <div class="history-item" onclick="fetchWeatherByCity('${city}')">
                        ${city}
                    </div>
                `).join('');
            } else {
                elements.searchHistory.style.display = 'none';
            }
        }
        
        // Add to Search History
        function addToSearchHistory(cityName) {
            // Remove if already exists
            searchHistory = searchHistory.filter(city => city.toLowerCase() !== cityName.toLowerCase());
            
            // Add to beginning
            searchHistory.unshift(cityName);
            
            // Keep only last 10 searches
            if (searchHistory.length > 10) {
                searchHistory.pop();
            }
            
            // Save to localStorage
            localStorage.setItem('weatherSearchHistory', JSON.stringify(searchHistory));
            
            // Update display
            updateSearchHistory();
        }
        
        // Handle Search
        async function handleSearch() {
            const city = elements.searchInput.value.trim();
            if (!city) return;
            
            elements.searchInput.value = '';
            await fetchWeatherByCity(city);
        }
        
        // Get Current Location
        function getCurrentLocation() {
            if (!navigator.geolocation) {
                alert('Geolocation is not supported by your browser.');
                return;
            }
            
            showLoading();
            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const { latitude, longitude } = position.coords;
                    await fetchWeatherByCoords(latitude, longitude);
                },
                (error) => {
                    hideLoading();
                    alert('Unable to retrieve your location. Please allow location access or search manually.');
                }
            );
        }
        
        // Go Back to Search
        function goBackToSearch() {
            // Hide weather display
            elements.weatherDisplay.style.display = 'none';
            elements.weatherHeader.classList.remove('visible');
            
            // Show search section
            elements.searchSection.style.display = 'block';
            elements.searchSection.classList.add('fade-in');
            
            // Reset particles to default
            generateWeatherParticles('clear');
            updateBackground('clear', false);
            
            // Focus search input
            elements.searchInput.focus();
            
            // Update search history display
            updateSearchHistory();
        }
        
        // Fetch Weather by City
        async function fetchWeatherByCity(city) {
            showLoading();
            try {
                const response = await axios.get(
                    `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}&units=${currentUnit}`
                );
                currentWeatherData = response.data;
                
                // Add to search history
                addToSearchHistory(city);
                
                updateWeatherDisplay();
                fetchHourlyForecast(currentWeatherData.coord.lat, currentWeatherData.coord.lon);
            } catch (error) {
                hideLoading();
                alert('City not found. Please check the city name and try again.');
            }
        }
        
        // Fetch Weather by Coordinates
        async function fetchWeatherByCoords(lat, lon) {
            showLoading();
            try {
                const response = await axios.get(
                    `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=${currentUnit}`
                );
                currentWeatherData = response.data;
                
                // Add to search history
                addToSearchHistory(currentWeatherData.name);
                
                updateWeatherDisplay();
                fetchHourlyForecast(lat, lon);
            } catch (error) {
                hideLoading();
                alert('Unable to fetch weather data for your location.');
            }
        }
        
        // Fetch Hourly Forecast
        async function fetchHourlyForecast(lat, lon) {
            try {
                const response = await axios.get(
                    `https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=${currentUnit}`
                );
                displayHourlyForecast(response.data);
            } catch (error) {
                console.error('Error fetching hourly forecast:', error);
            }
        }
        
        // Update Weather Display
        function updateWeatherDisplay() {
            if (!currentWeatherData) return;
            
            // Update basic info
            elements.cityName.textContent = currentWeatherData.name;
            elements.countryName.textContent = currentWeatherData.sys.country;
            elements.temperatureValue.textContent = Math.round(currentWeatherData.main.temp);
            elements.weatherDescription.textContent = currentWeatherData.weather[0].description;
            
            // Update header
            elements.headerLocation.textContent = `${currentWeatherData.name}, ${currentWeatherData.sys.country}`;
            
            // Update weather icon
            const iconCode = currentWeatherData.weather[0].icon;
            elements.weatherIcon.src = `https://openweathermap.org/img/wn/${iconCode}@4x.png`;
            elements.weatherIcon.alt = currentWeatherData.weather[0].description;
            
            // Update weather details
            updateWeatherDetails();
            
            // Update background based on weather
            updateBackground(currentWeatherData.weather[0].main, iconCode.includes('n'));
            
            // Update particles based on weather
            generateWeatherParticles(currentWeatherData.weather[0].main);
            
            // Show weather display and header
            elements.searchSection.style.display = 'none';
            elements.weatherDisplay.style.display = 'block';
            elements.weatherHeader.classList.add('visible');
            
            hideLoading();
        }
        
        // Update Weather Details
        function updateWeatherDetails() {
            const details = [
                {
                    icon: 'fas fa-thermometer-half',
                    value: `${Math.round(currentWeatherData.main.feels_like)}°`,
                    label: 'Feels Like'
                },
                {
                    icon: 'fas fa-tint',
                    value: `${currentWeatherData.main.humidity}%`,
                    label: 'Humidity'
                },
                {
                    icon: 'fas fa-wind',
                    value: `${Math.round(currentWeatherData.wind.speed)} ${currentUnit === 'metric' ? 'km/h' : 'mph'}`,
                    label: 'Wind Speed'
                },
                {
                    icon: 'fas fa-compress-arrows-alt',
                    value: `${currentWeatherData.main.pressure} hPa`,
                    label: 'Pressure'
                },
                {
                    icon: 'fas fa-eye',
                    value: `${currentWeatherData.visibility / 1000} km`,
                    label: 'Visibility'
                },
                {
                    icon: currentWeatherData.weather[0].main === 'Rain' ? 'fas fa-cloud-rain' : 
                          currentWeatherData.weather[0].main === 'Snow' ? 'fas fa-snowflake' :
                          currentWeatherData.weather[0].main === 'Clouds' ? 'fas fa-cloud' : 'fas fa-sun',
                    value: currentWeatherData.weather[0].main,
                    label: 'Condition'
                }
            ];
            
            elements.weatherDetails.innerHTML = details.map(detail => `
                <div class="detail-card">
                    <div class="detail-icon">
                        <i class="${detail.icon}"></i>
                    </div>
                    <div class="detail-value">${detail.value}</div>
                    <div class="detail-label">${detail.label}</div>
                </div>
            `).join('');
        }
        
        // Display Hourly Forecast
        function displayHourlyForecast(data) {
            const hourlyData = data.list.slice(0, 8); // Next 24 hours (3-hour intervals)
            
            elements.hourlyContainer.innerHTML = hourlyData.map(hour => {
                const date = new Date(hour.dt * 1000);
                const time = date.toLocaleTimeString('en-US', { hour: 'numeric', hour12: true });
                const temp = Math.round(hour.main.temp);
                const icon = hour.weather[0].icon;
                
                return `
                    <div class="hour-card">
                        <div class="hour-time">${time}</div>
                        <img src="https://openweathermap.org/img/wn/${icon}@2x.png" 
                             alt="${hour.weather[0].description}" 
                             class="hour-icon">
                        <div class="hour-temp">${temp}°</div>
                    </div>
                `;
            }).join('');
        }
        
        // Switch Units
        function switchUnit(unit) {
            if (currentUnit === unit) return;
            
            currentUnit = unit;
            
            // Update button states
            elements.celsiusBtn.classList.toggle('active', unit === 'metric');
            elements.fahrenheitBtn.classList.toggle('active', unit === 'imperial');
            
            // Update temperature unit display
            elements.temperatureUnit.textContent = unit === 'metric' ? '°C' : '°F';
            
            // Refetch weather data with new units
            if (currentWeatherData) {
                if (currentWeatherData.coord) {
                    fetchWeatherByCoords(currentWeatherData.coord.lat, currentWeatherData.coord.lon);
                } else {
                    fetchWeatherByCity(currentWeatherData.name);
                }
            }
        }
        
        // Update Header Time
        function updateHeaderTime() {
            const now = new Date();
            const time = now.toLocaleTimeString('en-US', { 
                hour: '2-digit', 
                minute: '2-digit',
                hour12: false 
            });
            elements.headerTime.textContent = time;
        }
        
        // Update Date and Time
        function updateDateTime() {
            const now = new Date();
            const options = {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            };
            elements.currentDate.textContent = now.toLocaleDateString('en-US', options);
        }
        
        // Update Background based on Weather
        function updateBackground(weatherCondition, isNight) {
            const body = document.body;
            
            if (isNight) {
                body.style.background = 'var(--night)';
                return;
            }
            
            switch (weatherCondition.toLowerCase()) {
                case 'clear':
                    body.style.background = 'var(--clear-sky)';
                    break;
                case 'clouds':
                    body.style.background = 'var(--cloudy)';
                    break;
                case 'rain':
                case 'drizzle':
                    body.style.background = 'var(--rainy)';
                    break;
                case 'snow':
                    body.style.background = 'var(--snowy)';
                    break;
                case 'thunderstorm':
                    body.style.background = 'var(--stormy)';
                    break;
                case 'mist':
                case 'fog':
                case 'haze':
                    body.style.background = 'var(--cloudy)';
                    break;
                default:
                    const hour = new Date().getHours();
                    if (hour >= 17 || hour <= 6) {
                        body.style.background = 'var(--night)';
                    } else if (hour >= 16 || hour <= 8) {
                        body.style.background = 'var(--sunset)';
                    } else {
                        body.style.background = 'var(--clear-sky)';
                    }
            }
        }
        
        // Generate Weather Particles
        function generateWeatherParticles(weatherCondition) {
            elements.weatherParticles.innerHTML = '';
            
            switch (weatherCondition.toLowerCase()) {
                case 'clouds':
                case 'broken clouds':
                    generateCloudParticles(15);
                    break;
                case 'rain':
                case 'drizzle':
                    generateRainParticles(50);
                    break;
                case 'snow':
                    generateSnowParticles(100);
                    break;
                case 'clear':
                    generateCloudParticles(5); // Few clouds for clear sky
                    break;
                default:
                    generateCloudParticles(8);
            }
        }
        
        function generateCloudParticles(count) {
            for (let i = 0; i < count; i++) {
                const cloud = document.createElement('div');
                cloud.className = 'weather-particle cloud';
                
                // Random properties
                const size = Math.random() * 120 + 40;
                const top = Math.random() * 80;
                const animationDelay = Math.random() * 60;
                const animationDuration = Math.random() * 40 + 40;
                const opacity = Math.random() * 0.3 + 0.5;
                
                cloud.style.width = `${size}px`;
                cloud.style.height = `${size * 0.6}px`;
                cloud.style.top = `${top}%`;
                cloud.style.left = `${Math.random() * 100}%`;
                cloud.style.animationDelay = `-${animationDelay}s`;
                cloud.style.animationDuration = `${animationDuration}s`;
                cloud.style.opacity = opacity;
                
                elements.weatherParticles.appendChild(cloud);
            }
        }
        
        function generateRainParticles(count) {
            for (let i = 0; i < count; i++) {
                const drop = document.createElement('div');
                drop.className = 'weather-particle rain-drop';
                
                const left = Math.random() * 100;
                const width = Math.random() * 2 + 1;
                const height = Math.random() * 20 + 10;
                const delay = Math.random() * 2;
                
                drop.style.width = `${width}px`;
                drop.style.height = `${height}px`;
                drop.style.left = `${left}%`;
                drop.style.animationDelay = `${delay}s`;
                
                elements.weatherParticles.appendChild(drop);
            }
        }
        
        function generateSnowParticles(count) {
            for (let i = 0; i < count; i++) {
                const flake = document.createElement('div');
                flake.className = 'weather-particle snow-flake';
                
                const size = Math.random() * 6 + 2;
                const left = Math.random() * 100;
                const delay = Math.random() * 10;
                const duration = Math.random() * 10 + 10;
                
                flake.style.width = `${size}px`;
                flake.style.height = `${size}px`;
                flake.style.left = `${left}%`;
                flake.style.animationDelay = `${delay}s`;
                flake.style.animationDuration = `${duration}s`;
                
                elements.weatherParticles.appendChild(flake);
            }
        }
        
        // Loading State
        function showLoading() {
            elements.loading.style.display = 'block';
        }
        
        function hideLoading() {
            elements.loading.style.display = 'none';
        }
        
        // Add some sample suggestions
        const suggestions = ['Tamil Nadu', 'London', 'New York', 'Tokyo', 'Paris', 'Sydney', 'Dubai', 'Singapore', 'Berlin'];
        elements.searchInput.addEventListener('focus', () => {
            if (!elements.searchInput.value) {
                elements.searchInput.placeholder = `Try: ${suggestions[Math.floor(Math.random() * suggestions.length)]}`;
            }
        });
        
        // Touch events for mobile
        let startX = 0;
        document.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
        });
        
        document.addEventListener('touchend', (e) => {
            const endX = e.changedTouches[0].clientX;
            const diffX = startX - endX;
            
            // Swipe from left edge to go back
            if (diffX > 100 && startX < 50) {
                goBackToSearch();
            }
        });
    </script>
</body>
</html>
